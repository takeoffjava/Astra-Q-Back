spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/astra-q
    username: rads
    password: rads
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update       # or validate / create-drop / none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # optional naming strategy (if you want snake_case auto-naming)
  jpa.properties.hibernate.physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Optional: server port
server:
  port: 8080
